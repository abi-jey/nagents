name: Rust harness release
on:
  push:
    tags: ['v0.100.*']
permissions:
  contents: read
concurrency:
  group: ngn-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Isolated release environment
        run: |
          python -m venv "$RUNNER_TEMP/ngn-release-venv"
          "$RUNNER_TEMP/ngn-release-venv/bin/python" -m pip install -e . -e ngn/integrations/nagents ruff mypy pre-commit playwright
          echo "$RUNNER_TEMP/ngn-release-venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/ngn-release-venv" >> "$GITHUB_ENV"
      - name: Require a release from main, with matching component versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python ngn/scripts/release.py check --tag "$RELEASE_TAG"
      - run: pre-commit run --all-files
      - name: Install test-only Chromium
        run: python -m playwright install --with-deps chromium
      - name: Build and package immutable candidate
        run: |
          cargo build --manifest-path ngn/Cargo.toml --release --locked -p ngn
          git diff --exit-code
          python ngn/scripts/release.py package --output artifacts --binary ngn/target/release/ngn
      - name: Test packaged binary and adapter wheel
        working-directory: ngn
        run: |
          export PYTHONPATH="$(find "$GITHUB_WORKSPACE/artifacts" -name 'ngn_nagents-*.whl' -print):$GITHUB_WORKSPACE/src"
          python scripts/smoke.py --binary target/release/ngn
          python scripts/release.py verify --output ../artifacts
      - name: Require the matching published core and non-editable auth integration
        env:
          NGN_TEST_BINARY: ${{ github.workspace }}/ngn/target/release/ngn
        run: |
          unset PYTHONPATH PYTHONHOME
          core_version=$(python -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          python -m venv "$RUNNER_TEMP/ngn-published-runtime"
          "$RUNNER_TEMP/ngn-published-runtime/bin/python" -m pip install --disable-pip-version-check "nagents==$core_version" artifacts/ngn_nagents-*.whl
          "$RUNNER_TEMP/ngn-published-runtime/bin/python" -m pip check
          "$RUNNER_TEMP/ngn-published-runtime/bin/python" -I -c 'from ngn_nagents.auth import available; assert available(), "Release blocked: publish the core with its public device-auth API and coordinate the adapter dependency first"'
          "$RUNNER_TEMP/ngn-published-runtime/bin/python" -m unittest discover -s ngn/integrations/nagents/tests -p test_native_auth.py -v
      - name: Accept installed source and the real desktop/touch browser before publication
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/ngn/target
          NGN_DEV_CACHE: ${{ runner.temp }}/ngn-release-acceptance
        run: |
          ./ngn/dev --test
          candidate=$(cat "$NGN_DEV_CACHE/latest-path")
          mkdir "$RUNNER_TEMP/ngn-packaged-app"
          tar -xzf artifacts/ngn-v*-linux-x86_64.tar.gz -C "$RUNNER_TEMP/ngn-packaged-app" ngn
          cmp "$candidate/app/ngn" "$RUNNER_TEMP/ngn-packaged-app/ngn"
          python ngn/scripts/browser_smoke.py --binary "$RUNNER_TEMP/ngn-packaged-app/ngn" \
            --runtime-python "$candidate/runtime/bin/python" \
            --output "$RUNNER_TEMP/ngn-browser-evidence"
      - name: Save real-browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ngn-release-browser-${{ github.sha }}
          path: ${{ runner.temp }}/ngn-browser-evidence/*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ngn-release
          path: artifacts/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ngn-release
          path: artifacts
      - name: Verify candidate binding and publish tested assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -m venv "$RUNNER_TEMP/ngn-verify-venv"
          "$RUNNER_TEMP/ngn-verify-venv/bin/python" ngn/scripts/release.py verify --output artifacts
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Refusing to overwrite an existing release.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" artifacts/* --verify-tag --title "ngn $RELEASE_TAG · Rust harness" --notes-file "ngn/docs/releases/${RELEASE_TAG#v}.md" --draft
          gh release edit "$RELEASE_TAG" --draft=false --latest
