name: Windows Voice Instructions SQLite Diagnostic

on:
  push:
    branches:
      - diag/voice-instructions-win-sqlite-20261017

permissions:
  contents: read

jobs:
  windows-sqlite-diagnostic:
    name: Windows py3.11 shard 3 SQLite diagnostic
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out diagnostic harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check out exact product commit
        uses: actions/checkout@v4
        with:
          ref: fc1f7d45eab4f0f28a3c9a7a95e2a41883399d0c
          path: product
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          allow-prereleases: true
          cache: pip
          cache-dependency-path: product/pyproject.toml

      - name: Install exact product test dependencies
        working-directory: product
        run: python -m pip install -e ".[dev,tui,voice,web]"

      - name: Run shard 3 with payload-free timing probes
        run: python .github/scripts/run_windows_sqlite_diagnostic.py

      - name: Upload filtered SQLite and snapshot trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-py311-shard3-sqlite-diagnostic-fc1f7d4
          path: ${{ runner.temp }}/ngn-voice-instructions-sqlite-trace.log
          if-no-files-found: warn
          retention-days: 3
