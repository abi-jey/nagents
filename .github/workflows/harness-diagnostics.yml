name: Offline harness diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/harness-diagnostics.yml'
      - 'benchmarks/**'
      - 'src/nagents/**/*.py'
      - 'tests/support/**'
      - 'pyproject.toml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/harness-diagnostics.yml'
      - 'benchmarks/**'
      - 'src/nagents/**/*.py'
      - 'tests/support/**'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NGN_DIAGNOSTIC_DOCKER_TESTS: '0'
      LITELLM_LOCAL_MODEL_COST_MAP: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install optional test environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r benchmarks/terminal_bench/requirements.txt editables==0.5
          .venv/bin/python -m pip install --no-build-isolation -e '.[dev]'
      - name: Test adapters and diagnostics without model calls
        run: >-
          .venv/bin/python -m pytest -q
          benchmarks/terminal_bench/tests
          benchmarks/diagnostics/tests
          benchmarks/tool_descriptions/test_run.py
          benchmarks/orchestration/test_run.py
          benchmarks/intent/test_run.py
          benchmarks/natural_errors
