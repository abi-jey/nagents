name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e integrations/nagents ruff mypy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: python -m unittest discover -s integrations/nagents/tests -v
      - run: python -m ruff check integrations/nagents scripts
      - run: python -m mypy --strict integrations/nagents/src integrations/nagents/tests
      - run: node --test web/app.test.js
      - run: cargo build --release --locked -p ngn
      - run: test "$(target/release/ngn --version)" = "ngn ${GITHUB_REF_NAME#v}"
      - run: python scripts/smoke.py --binary target/release/ngn
      - name: Package tested artifacts
        run: |
          mkdir -p artifacts
          tar -czf "artifacts/ngn-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" -C target/release ngn -C "$GITHUB_WORKSPACE" LICENSE README.md CHANGELOG.md config.example.json docs
          python -m pip wheel --no-deps --wheel-dir artifacts integrations/nagents
          cd artifacts
          sha256sum *.tar.gz *.whl > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
