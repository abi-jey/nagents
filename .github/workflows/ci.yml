name: CI
on: [push, pull_request]
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: node --test web/app.test.js
  adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e integrations/nagents ruff mypy
      - run: python -m ruff check integrations/nagents
      - run: python -m ruff format --check integrations/nagents
      - run: python -m mypy --strict integrations/nagents/src integrations/nagents/tests
      - run: python -m unittest discover -s integrations/nagents/tests -v
  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e integrations/nagents
      - run: cargo build --locked -p ngn
      - run: python scripts/smoke.py
