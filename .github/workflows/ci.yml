name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_alpha:
        description: 'Publish a tested feature-branch alpha to PyPI'
        required: false
        default: false
        type: boolean
      publish_dev:
        description: 'Publish dev release to PyPI'
        required: false
        default: false
        type: boolean
      version_bump:
        description: 'Version bump type (automatically publishes stable release)'
        required: false
        default: 'none'
        type: choice
        options:
          - none
          - patch
          - minor
          - major
      sqlite_trace:
        description: 'Manually enable scoped failure-only SQLite diagnostics for Windows tests; other events enable them automatically'
        required: false
        default: false
        type: boolean

jobs:
  # =============================================================================
  # LINT
  # =============================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files

      - name: Validate release modes
        if: github.event_name == 'workflow_dispatch'
        env:
          PUBLISH_DEV: ${{ inputs.publish_dev }}
          BUMP: ${{ inputs.version_bump }}
        run: test "$PUBLISH_DEV" != true || test "$BUMP" = none

      - name: Validate alpha release request
        if: github.event_name == 'workflow_dispatch' && inputs.publish_alpha
        env:
          REF: ${{ github.ref }}
          BUMP: ${{ inputs.version_bump }}
          PUBLISH_DEV: ${{ inputs.publish_dev }}
        run: |
          case "$REF" in refs/heads/*) ;; *) exit 1 ;; esac
          test "$REF" != refs/heads/main
          test "$BUMP" = none
          test "$PUBLISH_DEV" = false

  # =============================================================================
  # LINUX TESTS
  # =============================================================================
  test-linux:
    name: Test Linux (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: pip install -e ".[dev,tui,voice,web]"

      - name: Verify package import
        run: python -c "from nagents import Agent, Provider, ProviderType; print('Package imports work')"

      - name: Run tests
        run: pytest tests/ -n auto -v --cov=nagents --cov-report=xml --cov-report=term-missing

      - name: Check offline harness diagnostics
        if: matrix.python-version == '3.12'
        run: >-
          pytest -q benchmarks/terminal_bench/tests/test_runner.py
          benchmarks/diagnostics/tests/test_diagnostic.py

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # =============================================================================
  # MACOS TESTS
  # =============================================================================
  test-macos:
    name: Test macOS (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
        include:
          - os: macos-15-intel
            python-version: '3.13'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: pip install -e ".[dev,tui,voice,web]"

      - name: Report platform
        run: python -c "import platform; print(platform.platform(), platform.machine())"

      - name: Verify package import
        run: python -c "from nagents import Agent, Provider, ProviderType; print('Package imports work')"

      - name: Run tests
        run: pytest tests/ -n auto -v -o faulthandler_timeout=60

  # =============================================================================
  # WINDOWS TESTS
  # =============================================================================
  test-windows:
    name: Test Windows (py${{ matrix.python-version }}, shard ${{ matrix.group }}/${{ matrix.shards }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        shards: [3]
        group: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: pip install -e ".[dev,tui,voice,web]"

      - name: Verify package import
        run: python -c "from nagents import Agent, Provider, ProviderType; print('Package imports work')"

      - name: Run portable tests (POSIX harness cases are marked)
        shell: bash
        env:
          NGN_SQLITE_TRACE: ${{ (github.event_name != 'workflow_dispatch' || inputs.sqlite_trace) && '1' || '0' }}
        run: |
          python -m pytest -p tests.support.sqlite_trace \
            $(python .github/scripts/shard_tests.py --shards ${{ matrix.shards }} --group ${{ matrix.group }}) \
            -n auto -v -rs -o faulthandler_timeout=60

  # =============================================================================
  # BUMP VERSION (runs only after all tests pass)
  # =============================================================================
  bump-version:
    name: Bump Version
    runs-on: ubuntu-latest
    needs: [lint, test-linux, test-macos, test-windows]
    if: |
      github.event_name == 'workflow_dispatch' &&
      inputs.version_bump != 'none' &&
      needs.lint.result == 'success' &&
      needs.test-linux.result == 'success' &&
      needs.test-macos.result == 'success' &&
      needs.test-windows.result == 'success'
    outputs:
      version: ${{ steps.bump.outputs.version }}
      commit: ${{ steps.commit.outputs.sha }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install toml packaging

      - name: Bump version
        id: bump
        run: |
          import toml
          import subprocess
          import os
          from packaging.version import Version

          bump_type = "${{ inputs.version_bump }}"

          # Never release untested changes from a moving branch tip.
          subprocess.run(["git", "fetch", "origin", "main"], check=True)
          candidate = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          remote = subprocess.check_output(["git", "rev-parse", "origin/main"], text=True).strip()
          if os.environ["GITHUB_REF"] != "refs/heads/main" or candidate != remote:
              raise SystemExit("Stable bumps require the tested main SHA; rerun CI on current main.")

          with open('pyproject.toml', 'r') as f:
              config = toml.load(f)

          current = config['project']['version']
          major, minor, patch = Version(current).release

          if bump_type == 'major':
              major += 1
              minor = 0
              patch = 0
          elif bump_type == 'minor':
              minor += 1
              patch = 0
          elif bump_type == 'patch':
              patch += 1

          new_version = f"{major}.{minor}.{patch}"

          # If this tag already exists, keep bumping patch until we find a free version
          while True:
              tag = f"v{new_version}"
              result = subprocess.run(["git", "tag", "-l", tag], capture_output=True, text=True)
              if result.stdout.strip() == tag:
                  print(f"Tag {tag} already exists, bumping patch")
                  patch += 1
                  new_version = f"{major}.{minor}.{patch}"
              else:
                  break

          config['project']['version'] = new_version
          with open('pyproject.toml', 'w') as f:
              toml.dump(config, f)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"version={new_version}\n")

          print(f"Bumped version: {current} -> {new_version}")
        shell: python

      - name: Commit and push version bump
        id: commit
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add pyproject.toml
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }}"
          git push origin HEAD:refs/heads/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # =============================================================================
  # BUILD DISTRIBUTION
  # =============================================================================
  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      version: ${{ steps.candidate.outputs.version }}
    needs: [lint, bump-version, test-linux, test-macos, test-windows]
    if: |
      always() &&
      needs.lint.result == 'success' &&
      needs.test-linux.result == 'success' &&
      needs.test-macos.result == 'success' &&
      needs.test-windows.result == 'success' &&
      (needs.bump-version.result == 'success' || needs.bump-version.result == 'skipped')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Fetch successful version bump
        if: needs.bump-version.result == 'success'
        env:
          RELEASE_SHA: ${{ needs.bump-version.outputs.commit }}
        run: git fetch origin "$RELEASE_SHA" && git checkout --detach "$RELEASE_SHA"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: src/nagents/web-ui/package-lock.json

      - name: Install web dependencies
        working-directory: src/nagents/web-ui
        run: npm ci

      - name: Type-check web frontend
        working-directory: src/nagents/web-ui
        run: npm run typecheck

      - name: Test web frontend
        working-directory: src/nagents/web-ui
        run: npm test

      - name: Test browser voice E2E recorder
        run: node --test examples/live/browser_e2e/*.test.mjs

      - name: Check interaction demos
        working-directory: src/nagents/web-ui
        run: |
          npm run demo:subagents:build -- --outDir "$RUNNER_TEMP/ngn-subagent-concepts"
          npm run demo:subagents:test
          npm run demo:chat-flow:build -- --outDir "$RUNNER_TEMP/ngn-chat-flow"

      - name: Build web assets
        working-directory: src/nagents/web-ui
        run: npm run build

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build hatch pyyaml

      - name: Stamp feature alpha version
        if: github.event_name == 'workflow_dispatch' && inputs.publish_alpha
        run: python .github/scripts/alpha_version.py

      - name: Stamp dev version
        if: github.event_name == 'workflow_dispatch' && inputs.publish_dev
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re
          path = Path('pyproject.toml')
          text = path.read_text()
          suffix = f".dev{os.environ['GITHUB_RUN_NUMBER']}{int(os.environ['GITHUB_RUN_ATTEMPT']):03d}"
          text, count = re.subn(r'(?m)^version = "([^"]+)"$', lambda match: f'version = "{match[1]}{suffix}"', text)
          assert count == 1
          path.write_text(text)
          PY

      - name: Record immutable candidate
        id: candidate
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          ref = os.environ['GITHUB_REF']
          if ref.startswith('refs/tags/'):
              assert ref == f'refs/tags/v{version}', 'Release tag must match artifact version'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY

      - name: Build wheel and sdist
        run: python -m build

      - name: Bind artifacts to candidate
        env:
          RELEASE_SHA: ${{ steps.candidate.outputs.sha }}
          RELEASE_VERSION: ${{ steps.candidate.outputs.version }}
        run: python .github/scripts/release_artifacts.py create --dist dist --manifest release-manifest.json --sha "$RELEASE_SHA" --version "$RELEASE_VERSION"

      - name: Verify bundled web assets, skills, and instructions
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path
          import tarfile
          import zipfile
          import yaml

          def verify_assistant_document(content):
              lines = content.decode("utf-8").splitlines()
              assert lines and lines[0] == "---", "Assistant document needs YAML frontmatter"
              try:
                  closing = lines.index("---", 1)
              except ValueError as error:
                  raise AssertionError("Assistant document frontmatter is not closed") from error
              metadata = yaml.safe_load("\n".join(lines[1:closing]))
              assert isinstance(metadata, dict), "Assistant frontmatter must be a mapping"
              assert metadata.get("name") == "assistant"
              prompt = metadata.get("prompt")
              assert isinstance(prompt, str) and prompt.strip(), "Bundled assistant prompt is empty"
              live = metadata.get("live")
              assert isinstance(live, dict), "Bundled live defaults are missing"
              live_prompt = live.get("prompt")
              assert isinstance(live_prompt, str) and live_prompt.strip(), "Bundled live prompt is empty"

          instructions_path = "nagents/harness/instructions/assistant.md"
          source_instructions = Path(f"src/{instructions_path}").read_bytes()
          verify_assistant_document(source_instructions)
          with zipfile.ZipFile(next(Path("dist").glob("*.whl"))) as wheel:
              wheel_files = wheel.namelist()
              manifest = json.loads(wheel.read("nagents/web/static/build.json"))
              assert manifest["version"] == 1
              assert manifest["sources"] and manifest["assets"]
              for path, digest in manifest["assets"].items():
                  assert hashlib.sha256(wheel.read(f"nagents/web/static/{path}")).hexdigest() == digest, path
              instructions = wheel.read(instructions_path)
              assert instructions == source_instructions
              verify_assistant_document(instructions)
          with tarfile.open(next(Path("dist").glob("*.tar.gz"))) as sdist:
              sdist_files = [name.split("/", 1)[-1] for name in sdist.getnames()]
              prefix = sdist.getnames()[0].split("/", 1)[0]
              for path, digest in manifest["sources"].items():
                  source = sdist.extractfile(f"{prefix}/src/nagents/web-ui/{path}")
                  assert source is not None, path
                  assert hashlib.sha256(source.read()).hexdigest() == digest, path
              assistant_source = sdist.extractfile(f"{prefix}/src/{instructions_path}")
              assert assistant_source is not None, instructions_path
              sdist_instructions = assistant_source.read()
              assert sdist_instructions == source_instructions
              verify_assistant_document(sdist_instructions)

          assert "nagents/web/static/index.html" in wheel_files
          assert any(name.startswith("nagents/web/static/assets/") and name.endswith(".js") for name in wheel_files)
          assert "src/nagents/web/static/index.html" in sdist_files
          assert "src/nagents/web-ui/package-lock.json" in sdist_files
          assert not any(name.startswith("nagents/web-ui/") for name in wheel_files)
          for skill in ("ngn-customize", "ngn-channels"):
              path = f"nagents/skills/bundled/{skill}/SKILL.md"
              assert path in wheel_files, path
              assert f"src/{path}" in sdist_files, path
              with zipfile.ZipFile(next(Path("dist").glob("*.whl"))) as wheel:
                  content = wheel.read(path).decode("utf-8")
              assert f"name: {skill}\n" in content
              assert len(content.encode("utf-8")) <= 40000, "Keep bundled skill bodies within the default budget"
          for name in wheel_files + sdist_files:
              assert not {"node_modules", ".vite", ".cache", ".test-build"}.intersection(Path(name).parts), name
              assert not name.endswith(".tsbuildinfo"), name
          print("Web assets, built-in skills, and default instructions are bundled; frontend dependencies and caches are excluded")

      - name: List artifacts
        run: ls -la dist/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-manifest.json

  # =============================================================================
  # DOCKER BUILD & PUSH
  # =============================================================================
  docker-build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [build, bump-version]
    if: |
      always() &&
      needs.build.result == 'success' &&
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) ||
       github.event_name == 'workflow_dispatch' && inputs.version_bump != 'none' && needs.bump-version.result == 'success' ||
       github.event_name == 'workflow_dispatch' && inputs.publish_alpha)
    permissions:
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}/agent-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Fetch exact version bump
        if: github.event_name == 'workflow_dispatch' && needs.bump-version.result == 'success'
        env:
          RELEASE_SHA: ${{ needs.bump-version.outputs.commit }}
        run: git fetch origin "$RELEASE_SHA" && git checkout --detach "$RELEASE_SHA"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: github.event_name == 'workflow_dispatch' && inputs.publish_alpha
        with:
          python-version: '3.12'

      - name: Stamp the same feature alpha as the tested distribution
        if: github.event_name == 'workflow_dispatch' && inputs.publish_alpha
        run: python .github/scripts/alpha_version.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ needs.build.outputs.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=alpha-${{ github.run_number }}-${{ github.run_attempt }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.publish_alpha }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=v${{ needs.bump-version.outputs.version }},enable=${{ needs.bump-version.result == 'success' }}

      - name: Verify Docker candidate
        env:
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: dockerfiles/Runtime.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =============================================================================
  # PUBLISH & RELEASE (Stable)
  # =============================================================================
  publish-stable:
    name: Publish & Release (Stable)
    runs-on: ubuntu-latest
    needs: [bump-version, build]
    if: |
      always() &&
      needs.build.result == 'success' &&
      !inputs.publish_alpha &&
      (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version_bump != 'none'))
    environment:
      name: pypi-stable
      url: https://pypi.org/project/nagents/
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Checkout exact release candidate
        env:
          RELEASE_SHA: ${{ needs.bump-version.outputs.commit || github.sha }}
        run: git fetch origin "$RELEASE_SHA" && git checkout --detach "$RELEASE_SHA"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install toml

      - name: Get version
        id: version
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: |
          import tomllib
          import os
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert version == os.environ['EXPECTED_VERSION']
          ref = os.environ['GITHUB_REF']
          if ref.startswith('refs/tags/'):
              assert ref == f'refs/tags/v{version}', 'Release tag must match artifact version'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
        shell: python

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: provenance

      - name: Verify release artifacts
        env:
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          python .github/scripts/release_artifacts.py verify --dist dist --manifest provenance/release-manifest.json --sha "$RELEASE_SHA" --version "$RELEASE_VERSION"
          TAG_SHA=$(git rev-parse -q --verify "refs/tags/v${RELEASE_VERSION}^{commit}" || true)
          test -z "$TAG_SHA" || test "$TAG_SHA" = "$RELEASE_SHA"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

      - name: Get previous stable tag
        id: prev_tag
        run: |
          PREV_TAG=$(git tag --merged HEAD -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx 'v${{ steps.version.outputs.version }}' | head -1 || true)
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT
          echo "Previous stable tag: $PREV_TAG"

      - name: Generate release notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PREV_TAG="${{ steps.prev_tag.outputs.prev_tag }}"

          echo "## What's Changed" > release_notes.md
          echo "" >> release_notes.md

          git log ${PREV_TAG}..HEAD --pretty=format:"* %s (%h)" --no-merges >> release_notes.md

          echo "" >> release_notes.md
          echo "" >> release_notes.md
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...v${VERSION}" >> release_notes.md

          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ needs.bump-version.outputs.commit || github.sha }}
          body_path: release_notes.md
          files: dist/*

  # =============================================================================
  # FEATURE-BRANCH ALPHAS (same tested SHA and built artifacts, no branch changes)
  # =============================================================================
  publish-alpha:
    name: Publish Feature Alpha
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.publish_alpha && needs.build.result == 'success' }}
    environment:
      name: pypi-alpha
      url: https://pypi.org/project/nagents/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: provenance
      - name: Verify release artifacts
        env:
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          python .github/scripts/release_artifacts.py verify --dist dist --manifest provenance/release-manifest.json --sha "$RELEASE_SHA" --version "$RELEASE_VERSION"

      - name: Publish tested alpha artifacts
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

  # =============================================================================
  # PUBLISH & RELEASE (Dev)
  # =============================================================================
  publish-dev:
    name: Publish & Release (Dev)
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_dev
    environment:
      name: pypi-dev
      url: https://pypi.org/project/nagents/
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: provenance

      - name: Verify release artifacts
        env:
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          python .github/scripts/release_artifacts.py verify --dist dist --manifest provenance/release-manifest.json --sha "$RELEASE_SHA" --version "$RELEASE_VERSION"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Dev v${{ needs.build.outputs.version }}
          target_commitish: ${{ needs.build.outputs.sha }}
          prerelease: true
          generate_release_notes: true
          files: dist/*
