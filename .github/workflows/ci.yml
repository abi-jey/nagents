name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_alpha:
        description: 'Publish a tested feature-branch alpha to PyPI'
        required: false
        default: false
        type: boolean
      publish_dev:
        description: 'Publish dev release to PyPI'
        required: false
        default: false
        type: boolean
      sqlite_trace:
        description: 'Manually enable scoped failure-only SQLite diagnostics for Windows tests; other events enable them automatically'
        required: false
        default: false
        type: boolean

# Supersede stale checks on the same PR without interrupting publishing runs.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # =============================================================================
  # LINT
  # =============================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: pip install pre-commit

      # The ngn-* hooks (Rust fmt/clippy/tests, adapter and browser gates) run in
      # Rust harness CI whenever ngn/ or src/nagents/ changes; don't repeat them here.
      - name: Run pre-commit
        env:
          SKIP: ngn-rust-format,ngn-rust-clippy,ngn-rust-tests,ngn-python-lint,ngn-python-format,ngn-python-types,ngn-python-tests,ngn-browser-syntax,ngn-browser-tests
        run: pre-commit run --all-files

      - name: Validate alpha release request
        if: github.event_name == 'workflow_dispatch' && inputs.publish_alpha
        env:
          REF: ${{ github.ref }}
          PUBLISH_DEV: ${{ inputs.publish_dev }}
        run: |
          case "$REF" in refs/heads/*) ;; *) exit 1 ;; esac
          test "$REF" != refs/heads/main
          test "$PUBLISH_DEV" = false

  # =============================================================================
  # TESTS: oldest and newest supported Python on Linux, newest on macOS and
  # Windows. Every job runs one third of tests/ so the slowest shard sets the pace.
  # =============================================================================
  test:
    name: Test ${{ matrix.os }} (py${{ matrix.python-version }}, shard ${{ matrix.group }}/3)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.15.x']
        group: [1, 2, 3]
        include:
          - {os: ubuntu-latest, python-version: '3.12', group: 1}
          - {os: ubuntu-latest, python-version: '3.12', group: 2}
          - {os: ubuntu-latest, python-version: '3.12', group: 3}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: pip install -e ".[dev,tui,voice,web]"

      - name: Run tests (POSIX harness cases are marked for Windows)
        shell: bash
        env:
          NGN_SQLITE_TRACE: ${{ runner.os == 'Windows' && (github.event_name != 'workflow_dispatch' || inputs.sqlite_trace) && '1' || '0' }}
          COVERAGE: ${{ runner.os == 'Linux' && matrix.python-version == '3.12' && '--cov=nagents --cov-report=xml' || '' }}
        run: |
          python -m pytest -p tests.support.sqlite_trace $COVERAGE \
            $(python .github/scripts/shard_tests.py --shards 3 --group ${{ matrix.group }}) \
            -n auto -q -rs -o faulthandler_timeout=60

      - name: Upload coverage
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # =============================================================================
  # BUILD DISTRIBUTION (runs alongside tests; publishing jobs wait for both)
  # =============================================================================
  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      version: ${{ steps.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: src/nagents/web-ui/package-lock.json

      - name: Install web dependencies
        working-directory: src/nagents/web-ui
        run: npm ci

      - name: Type-check web frontend
        working-directory: src/nagents/web-ui
        run: npm run typecheck

      - name: Test web frontend
        working-directory: src/nagents/web-ui
        run: npm test

      - name: Test browser voice E2E recorder
        run: node --test examples/live/browser_e2e/*.test.mjs

      - name: Check interaction demos
        working-directory: src/nagents/web-ui
        run: |
          npm run demo:subagents:build -- --outDir "$RUNNER_TEMP/ngn-subagent-concepts"
          npm run demo:subagents:test
          npm run demo:chat-flow:build -- --outDir "$RUNNER_TEMP/ngn-chat-flow"

      - name: Build web assets
        working-directory: src/nagents/web-ui
        run: npm run build

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build hatch pyyaml

      - name: Stamp feature alpha version
        if: github.event_name == 'workflow_dispatch' && inputs.publish_alpha
        run: python .github/scripts/alpha_version.py

      - name: Stamp dev version
        if: github.event_name == 'workflow_dispatch' && inputs.publish_dev
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re
          path = Path('pyproject.toml')
          text = path.read_text()
          suffix = f".dev{os.environ['GITHUB_RUN_NUMBER']}{int(os.environ['GITHUB_RUN_ATTEMPT']):03d}"
          text, count = re.subn(r'(?m)^version = "([^"]+)"$', lambda match: f'version = "{match[1]}{suffix}"', text)
          assert count == 1
          path.write_text(text)
          PY

      - name: Record immutable candidate
        id: candidate
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import os
          import subprocess
          import sys
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          ref = os.environ['GITHUB_REF']
          if ref.startswith('refs/tags/'):
              assert ref == f'refs/tags/v{version}', 'Release tag must match artifact version'
          if ref.startswith('refs/tags/v0.100.'):
              subprocess.run([sys.executable, 'ngn/scripts/release.py', 'check', '--tag', ref.removeprefix('refs/tags/')], check=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY

      - name: Build wheel and sdist
        run: python -m build

      - name: Bind artifacts to candidate
        env:
          RELEASE_SHA: ${{ steps.candidate.outputs.sha }}
          RELEASE_VERSION: ${{ steps.candidate.outputs.version }}
        run: python .github/scripts/release_artifacts.py create --dist dist --manifest release-manifest.json --sha "$RELEASE_SHA" --version "$RELEASE_VERSION"

      - name: Verify bundled web assets, skills, and instructions
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path
          import tarfile
          import zipfile
          import yaml

          def verify_assistant_document(content):
              lines = content.decode("utf-8").splitlines()
              assert lines and lines[0] == "---", "Assistant document needs YAML frontmatter"
              try:
                  closing = lines.index("---", 1)
              except ValueError as error:
                  raise AssertionError("Assistant document frontmatter is not closed") from error
              metadata = yaml.safe_load("\n".join(lines[1:closing]))
              assert isinstance(metadata, dict), "Assistant frontmatter must be a mapping"
              assert metadata.get("name") == "assistant"
              prompt = metadata.get("prompt")
              assert isinstance(prompt, str) and prompt.strip(), "Bundled assistant prompt is empty"
              live = metadata.get("live")
              assert isinstance(live, dict), "Bundled live defaults are missing"
              live_prompt = live.get("prompt")
              assert isinstance(live_prompt, str) and live_prompt.strip(), "Bundled live prompt is empty"

          instructions_path = "nagents/harness/instructions/assistant.md"
          source_instructions = Path(f"src/{instructions_path}").read_bytes()
          verify_assistant_document(source_instructions)
          with zipfile.ZipFile(next(Path("dist").glob("*.whl"))) as wheel:
              wheel_files = wheel.namelist()
              manifest = json.loads(wheel.read("nagents/web/static/build.json"))
              assert manifest["version"] == 1
              assert manifest["sources"] and manifest["assets"]
              for path, digest in manifest["assets"].items():
                  assert hashlib.sha256(wheel.read(f"nagents/web/static/{path}")).hexdigest() == digest, path
              instructions = wheel.read(instructions_path)
              assert instructions == source_instructions
              verify_assistant_document(instructions)
          with tarfile.open(next(Path("dist").glob("*.tar.gz"))) as sdist:
              sdist_files = [name.split("/", 1)[-1] for name in sdist.getnames()]
              prefix = sdist.getnames()[0].split("/", 1)[0]
              for path, digest in manifest["sources"].items():
                  source = sdist.extractfile(f"{prefix}/src/nagents/web-ui/{path}")
                  assert source is not None, path
                  assert hashlib.sha256(source.read()).hexdigest() == digest, path
              assistant_source = sdist.extractfile(f"{prefix}/src/{instructions_path}")
              assert assistant_source is not None, instructions_path
              sdist_instructions = assistant_source.read()
              assert sdist_instructions == source_instructions
              verify_assistant_document(sdist_instructions)

          assert "nagents/web/static/index.html" in wheel_files
          assert any(name.startswith("nagents/web/static/assets/") and name.endswith(".js") for name in wheel_files)
          assert "src/nagents/web/static/index.html" in sdist_files
          assert "src/nagents/web-ui/package-lock.json" in sdist_files
          assert not any(name.startswith("nagents/web-ui/") for name in wheel_files)
          for skill in ("ngn-customize", "ngn-channels"):
              path = f"nagents/skills/bundled/{skill}/SKILL.md"
              assert path in wheel_files, path
              assert f"src/{path}" in sdist_files, path
              with zipfile.ZipFile(next(Path("dist").glob("*.whl"))) as wheel:
                  content = wheel.read(path).decode("utf-8")
              assert f"name: {skill}\n" in content
              assert len(content.encode("utf-8")) <= 40000, "Keep bundled skill bodies within the default budget"
          for name in wheel_files + sdist_files:
              assert not {"node_modules", ".vite", ".cache", ".test-build"}.intersection(Path(name).parts), name
              assert not name.endswith(".tsbuildinfo"), name
          print("Web assets, built-in skills, and default instructions are bundled; frontend dependencies and caches are excluded")

      - name: List artifacts
        run: ls -la dist/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release-manifest.json

  # =============================================================================
  # DOCKER BUILD & PUSH
  # =============================================================================
  docker-build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: |
      github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) ||
      github.event_name == 'workflow_dispatch' && inputs.publish_alpha
    permissions:
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}/agent-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: github.event_name == 'workflow_dispatch' && inputs.publish_alpha
        with:
          python-version: '3.12'

      - name: Stamp the same feature alpha as the tested distribution
        if: github.event_name == 'workflow_dispatch' && inputs.publish_alpha
        run: python .github/scripts/alpha_version.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-${{ needs.build.outputs.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=alpha-${{ github.run_number }}-${{ github.run_attempt }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.publish_alpha }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Verify Docker candidate
        env:
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: dockerfiles/Runtime.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =============================================================================
  # PUBLISH CORE TO PYPI (the shared tag calls the sole GitHub publisher below)
  # =============================================================================
  publish-stable:
    name: Publish Core to PyPI (Stable)
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.publish_alpha
    environment:
      name: pypi-stable
      url: https://pypi.org/project/nagents/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Checkout exact release candidate
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: git fetch origin "$RELEASE_SHA" && git checkout --detach "$RELEASE_SHA"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install toml

      - name: Get version
        id: version
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: |
          import tomllib
          import os
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert version == os.environ['EXPECTED_VERSION']
          ref = os.environ['GITHUB_REF']
          if ref.startswith('refs/tags/'):
              assert ref == f'refs/tags/v{version}', 'Release tag must match artifact version'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
        shell: python

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: provenance

      - name: Verify release artifacts
        env:
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          python .github/scripts/release_artifacts.py verify --dist dist --manifest provenance/release-manifest.json --sha "$RELEASE_SHA" --version "$RELEASE_VERSION"
          TAG_SHA=$(git rev-parse -q --verify "refs/tags/v${RELEASE_VERSION}^{commit}" || true)
          test -z "$TAG_SHA" || test "$TAG_SHA" = "$RELEASE_SHA"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

  publish-ngn:
    name: Publish Coordinated Native/Core GitHub Release
    needs: [publish-stable]
    if: ${{ !cancelled() && needs.publish-stable.result == 'success' && startsWith(github.ref, 'refs/tags/v0.100.') }}
    permissions:
      contents: write
    uses: ./.github/workflows/ngn-release.yml
    secrets: inherit

  # =============================================================================
  # FEATURE-BRANCH ALPHAS (same tested SHA and built artifacts, no branch changes)
  # =============================================================================
  publish-alpha:
    name: Publish Feature Alpha
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_alpha
    environment:
      name: pypi-alpha
      url: https://pypi.org/project/nagents/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: provenance
      - name: Verify release artifacts
        env:
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          python .github/scripts/release_artifacts.py verify --dist dist --manifest provenance/release-manifest.json --sha "$RELEASE_SHA" --version "$RELEASE_VERSION"

      - name: Publish tested alpha artifacts
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/

  # =============================================================================
  # PUBLISH CORE TO PYPI (Dev; no separate GitHub release)
  # =============================================================================
  publish-dev:
    name: Publish Core to PyPI (Dev)
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_dev
    environment:
      name: pypi-dev
      url: https://pypi.org/project/nagents/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: provenance

      - name: Verify release artifacts
        env:
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          python .github/scripts/release_artifacts.py verify --dist dist --manifest provenance/release-manifest.json --sha "$RELEASE_SHA" --version "$RELEASE_VERSION"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
