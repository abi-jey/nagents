name: Rust harness CI
on:
  push:
    branches: [main]
    paths: ['ngn/**', 'src/nagents/**', 'pyproject.toml', '.pre-commit-config.yaml', '.github/workflows/ngn-*.yml']
  pull_request:
    paths: ['ngn/**', 'src/nagents/**', 'pyproject.toml', '.pre-commit-config.yaml', '.github/workflows/ngn-*.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    name: Rust, adapter, browser and real TUI/web acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ngn
          shared-key: ngn-linux-x86_64
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: src/nagents/web-ui/package-lock.json
      - name: Install web dependencies
        working-directory: src/nagents/web-ui
        run: npm ci
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Create isolated test environment
        run: |
          python -m venv "$RUNNER_TEMP/ngn-venv"
          "$RUNNER_TEMP/ngn-venv/bin/python" -m pip install -e . -e ngn/integrations/nagents ruff mypy playwright 'build>=1.2'
          echo "$RUNNER_TEMP/ngn-venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/ngn-venv" >> "$GITHUB_ENV"
      - name: All Rust/adapter/browser gates
        run: bash ngn/scripts/check.sh all
      - name: Install test-only Chromium
        run: python -m playwright install --with-deps chromium
      - name: Build optimized binary and package adapter wheel
        run: |
          cargo build --manifest-path ngn/Cargo.toml --release --locked -p ngn
          python ngn/scripts/release.py package --output artifacts --binary ngn/target/release/ngn
      - name: Exercise native authentication with a synthetic issuer and no skipped cases
        env:
          NGN_TEST_BINARY: ${{ github.workspace }}/ngn/target/release/ngn
        run: |
          python -I -c 'from ngn_nagents.auth import available; assert available(), "The source core must expose public device authentication for this gate"'
          python -m unittest discover -s ngn/integrations/nagents/tests -p test_native_auth.py -v
      - name: Test the packaged binary and adapter, not editable adapter imports
        working-directory: ngn
        run: |
          export PYTHONPATH="$(find "$GITHUB_WORKSPACE/artifacts" -name 'ngn_nagents-*.whl' -print):$GITHUB_WORKSPACE/src"
          python scripts/smoke.py --binary target/release/ngn
          python scripts/release.py verify --output ../artifacts
      - name: Accept a relocated self-contained installation without host Python or package tools
        run: |
          bundled="$RUNNER_TEMP/ngn-bundled-artifacts"
          python ngn/scripts/release.py package --output "$bundled" --binary ngn/target/release/ngn --bundle
          python ngn/scripts/install_smoke.py --installer "$bundled/ngn-installer-linux-x86_64" \
            --bundle "$bundled"/ngn-v*-linux-x86_64-bundle.tar.gz \
            --output "$RUNNER_TEMP/ngn-bundled-acceptance"
      - name: Accept current-source development and the real self-contained touch browser
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/ngn/target
          NGN_DEV_CACHE: ${{ runner.temp }}/ngn-dev-acceptance
        run: |
          ./ngn/dev --test
          candidate=$(cat "$NGN_DEV_CACHE/latest-path")
          mkdir "$RUNNER_TEMP/ngn-packaged-app"
          tar -xzf artifacts/ngn-v*-linux-x86_64.tar.gz -C "$RUNNER_TEMP/ngn-packaged-app" ngn
          cmp "$candidate/app/ngn" "$RUNNER_TEMP/ngn-packaged-app/ngn"
          bundled_binary=$(python -c 'import json,os,pathlib; print(json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"ngn-bundled-acceptance/evidence.json").read_text())["command"])')
          bundled_python=$(python -c 'import json,os,pathlib; print(json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"ngn-bundled-acceptance/evidence.json").read_text())["runtime_python"])')
          cmp "$RUNNER_TEMP/ngn-packaged-app/ngn" "$bundled_binary"
          python ngn/scripts/browser_smoke.py --binary "$bundled_binary" \
            --runtime-python "$bundled_python" \
            --output "$RUNNER_TEMP/ngn-browser-evidence"
          python ngn/scripts/steering_clients_smoke.py --binary "$bundled_binary" \
            --runtime-python "$bundled_python" --installed-runtime \
            --output "$RUNNER_TEMP/ngn-browser-evidence"
      - name: Save real-browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ngn-browser-${{ github.sha }}
          path: ${{ runner.temp }}/ngn-browser-evidence/*.png
          if-no-files-found: warn
      - name: Save self-contained installation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ngn-bundled-install-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ngn-bundled-acceptance/*.log
            ${{ runner.temp }}/ngn-bundled-acceptance/evidence.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ngn-linux-x86_64-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
  macos:
    name: macOS ${{ matrix.platform }} native bundle acceptance
    strategy:
      fail-fast: false
      matrix:
        # PRs skip macOS x86_64 (ngn-release.yml still tests it); main builds it so
        # its Cargo cache is warm for the next release.
        include: ${{ fromJSON(github.event_name == 'pull_request'
          && '[{"runner":"macos-15","platform":"macos-arm64"}]'
          || '[{"runner":"macos-15","platform":"macos-arm64"},{"runner":"macos-15-intel","platform":"macos-x86_64"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ngn
          shared-key: ngn-${{ matrix.platform }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: src/nagents/web-ui/package-lock.json
      - name: Install web dependencies
        working-directory: src/nagents/web-ui
        run: npm ci
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Create isolated test environment
        run: |
          python -m venv "$RUNNER_TEMP/ngn-venv"
          "$RUNNER_TEMP/ngn-venv/bin/python" -m pip install -e . -e ngn/integrations/nagents 'build>=1.2'
          echo "$RUNNER_TEMP/ngn-venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/ngn-venv" >> "$GITHUB_ENV"
      - name: Rust tests
        run: cargo test --manifest-path ngn/Cargo.toml --locked --no-fail-fast
      - name: Packaging script tests
        # Independent of the Rust tests: report every failing gate in one run.
        if: ${{ !cancelled() }}
        working-directory: ngn/scripts
        run: python -m unittest test_bundle test_release test_install_bootstrap -v
      - name: Build, package and verify the native binary
        # Independent of the Rust tests: report every failing gate in one run.
        if: ${{ !cancelled() }}
        run: |
          cargo build --manifest-path ngn/Cargo.toml --release --locked -p ngn
          python ngn/scripts/release.py package --output artifacts --binary ngn/target/release/ngn
          cd ngn
          export PYTHONPATH="$(find "$GITHUB_WORKSPACE/artifacts" -name 'ngn_nagents-*.whl' -print):$GITHUB_WORKSPACE/src"
          python scripts/smoke.py --binary target/release/ngn
      - name: Accept a relocated self-contained installation without host Python or package tools
        run: |
          bundled="$RUNNER_TEMP/ngn-bundled-artifacts"
          python ngn/scripts/release.py package --output "$bundled" --binary ngn/target/release/ngn --bundle
          python ngn/scripts/install_smoke.py --installer "$bundled/ngn-installer-${{ matrix.platform }}" \
            --bundle "$bundled"/ngn-v*-${{ matrix.platform }}-bundle.tar.gz \
            --output "$RUNNER_TEMP/ngn-bundled-acceptance"
      - name: Save self-contained installation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ngn-bundled-install-${{ matrix.platform }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ngn-bundled-acceptance/*.log
            ${{ runner.temp }}/ngn-bundled-acceptance/evidence.json
          if-no-files-found: warn
