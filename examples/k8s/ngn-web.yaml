# Public ngn React deployment TEMPLATE; render privately before validation/apply.
# Review secret preparation, live validation, and cutover before applying.
# See ../../docs/guide/ngn-web-deployment.md before applying. No secrets here.
# This file never changes the existing nagents Deployment, Service, or Ingress.
# Substitute ONLY NGN_NODE and NGN_STATE_PATH.
# ngn serve binds 0.0.0.0 directly and the main container runs as root to prepare state.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ngn-web-local
  labels:
    app: ngn-web
spec:
  capacity:
    # Binding size only: hostPath does not enforce a 5 GiB filesystem quota.
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: nagents
    name: ngn-web-state
  hostPath:
    path: "${NGN_STATE_PATH}"
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - "${NGN_NODE}"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ngn-web-state
  namespace: nagents
  labels:
    app: ngn-web
spec:
  storageClassName: ""
  volumeName: ngn-web-local
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ngn-web-config
  namespace: nagents
  labels:
    app: ngn-web
data:
  config.yaml: |
    provider: openai
    auth: chatgpt
    api: auto
    data_dir: /state/sessions
    # Chat still uses the Codex default; transcription has a separate API key.
    dictation_enabled: true
    dictation_api_key_env: NGN_TRANSCRIPTION_API_KEY
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ngn-web
  namespace: nagents
  labels:
    app: ngn-web
spec:
  replicas: 1
  # SQLite and the rotating credential store must have exactly one owner.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ngn-web
  template:
    metadata:
      labels:
        app: ngn-web
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/hostname: "${NGN_NODE}"
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        # Deliberately no fsGroup: OpenAIAuth requires 0700 dirs / 0600 files.
      containers:
        - name: ngn
          image: ghcr.io/abi-jey/nagents/agent-server@sha256:2def52cc2843d1b7d599b91029b8a83c6e36bc97c4d71eae489dcb5eef578d50
          imagePullPolicy: IfNotPresent
          # Prepare fixed private state directories and install the one-time seed
          # credential if absent, then exec ngn. Runs as root so it can own and
          # mode /state and the OpenAIAuth store without a separate init container.
          command:
            - /bin/sh
            - -ec
            - |
              umask 077
              for directory in /state /state/home /state/config /state/workspace /state/sessions /state/channel-plugins /state/data /state/data/ngn /state/data/ngn/auth; do
                mkdir -p "$directory"
                chmod 0700 "$directory"
              done
              credential=/state/data/ngn/auth/openai.json
              if [ ! -e "$credential" ]; then
                if [ ! -s /seed/openai.json ]; then
                  printf '%s\n' 'No saved ngn credential: provide ngn-web-codex-seed/openai.json for first startup.' >&2
                  exit 1
                fi
                # Dereference the projected Secret only here.
                install -m 0600 /seed/openai.json "$credential"
              fi
              exec ngn serve \
                --host 0.0.0.0 \
                --port 8765 \
                --workspace /state/workspace \
                --config /etc/ngn/config.yaml
          workingDir: /state/workspace
          ports:
            - name: http
              containerPort: 8765
          env:
            - name: HOME
              value: /state/home
            - name: XDG_DATA_HOME
              value: /state/data
            - name: XDG_CONFIG_HOME
              value: /state/config
            - name: NGN_CHANNEL_PLUGIN_PATH
              value: /state/channel-plugins
            # Optional at startup: Settings reports a missing transcription key.
            # This variable is not used for the Codex chat connection.
            - name: NGN_TRANSCRIPTION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ngn-web-transcription
                  key: api-key
                  optional: true
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            exec:
              command:
                - curl
                - -fsS
                - --max-time
                - "2"
                - -o
                - /dev/null
                - http://127.0.0.1:8765/api/bootstrap
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: state
              mountPath: /state
            - name: config
              mountPath: /etc/ngn
              readOnly: true
            - name: ngn-tmp
              mountPath: /tmp
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: ngn-web-state
        - name: config
          configMap:
            name: ngn-web-config
        - name: codex-seed
          secret:
            secretName: ngn-web-codex-seed
            optional: true
            defaultMode: 0400
            items:
              - key: openai.json
                path: openai.json
        - name: ngn-tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ngn-web
  namespace: nagents
  labels:
    app: ngn-web
spec:
  type: ClusterIP
  selector:
    app: ngn-web
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ngn-web
  namespace: nagents
  labels:
    app: ngn-web
spec:
  # Cluster-specific ts-serve operator, NOT the official Tailscale operator.
  # It owns ngn-web-ts; the Ingress name determines its private HTTPS hostname.
  ingressClassName: ts-serve
  defaultBackend:
    service:
      name: ngn-web
      port:
        number: 8080
