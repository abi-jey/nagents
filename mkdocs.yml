site_name: nagents
site_description: A lightweight Python agents library, Python clients, and a native Rust harness with a self-contained installer
site_author: abi-jey
site_url: https://abi-jey.github.io/nagents/
repo_name: abi-jey/nagents
repo_url: https://github.com/abi-jey/nagents

validation:
  links:
    not_found: warn
    anchors: warn

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - content.footnote.tooltips
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - abbr
  - admonition
  - def_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      auto_append:
        - docs/includes/abbreviations.md
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            heading_level: 2

nav:
  - Home: index.md
  - Getting Started:
      - Choose an Installation: getting-started/installation.md
      - Native ngn Installer and Usage: guide/native-ngn.md
      - Python Library Quick Start: getting-started/quickstart.md
      - Python Library Configuration: getting-started/configuration.md
  - User Guide:
      - Native ngn Migration and Safety: guide/native-ngn-migration.md
      - Python ngn Terminal Harness: guide/ngn.md
      - Python ngn Installation: guide/ngn-installation.md
      - API Changes in 0.23: guide/api-changes.md
      - Python ngn Configuration: guide/ngn-configuration.md
      - Python ngn Agent Definitions: guide/agent-definitions.md
      - Python ngn Local Web Client: guide/ngn-web.md
      - Python ngn Delegated Agents: guide/task-inspection.md
      - Python ngn Container: guide/ngn-container.md
      - Python ngn Private Web Deployment: guide/ngn-web-deployment.md
      - Remote Agents over A2A: guide/a2a.md
      - Providers: guide/providers.md
      - Foundry Authentication: guide/foundry-authentication.md
      - Tools: guide/tools.md
      - Skills: guide/skills.md
      - Sessions: guide/sessions.md
      - Channels and Listening: guide/channels.md
      - Channel Configuration by Chat: guide/channel-configuration.md
      - Compaction: guide/compaction.md
      - Events: guide/events.md
      - Batch Processing: guide/batch.md
  - Examples:
      - Basic Agent: examples/basic-agent.md
      - Multi-Provider: examples/multi-provider.md
      - Tool Usage: examples/tool-usage.md
  - API Reference:
      - Agent: api/agent.md
      - Provider: api/provider.md
      - Types: api/types.md
      - Events: api/events.md
      - Session: api/session.md
      - Context Statistics: api/context-stats.md
      - Conversation Cache: api/conversation-cache.md
      - Channels: api/channels.md
      - Channel Execution Events: api/channel-execution-events.md
      - Tools: api/tools.md
      - Skills: api/skills.md
      - Batch: api/batch.md
  - Development:
      - Contributing: development/contributing.md
      - Coordinated Releases: guide/releases.md
      - Harness Research: development/harness-research.md
      - A2A Interoperability: development/a2a-conformance.md
      - Built-in UI Channels Design: development/builtin-ui-channels.md
