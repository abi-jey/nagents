# Preserve hash-verified upstream notices byte-for-byte; never reformat legal texts.
exclude: ^ngn/runtime-licenses(-[a-z0-9_-]+)?/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: [--fix]
        exclude: ^ngn/
      - id: ruff-format
        exclude: ^ngn/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        exclude: ^ngn/
        additional_dependencies: ["aiohttp>=3.14.4", "aiosqlite>=0.20.0", "pytest>=8.0", "httpx>=0.28.1", "httpx2>=2.0.0", "textual>=8.2.8", "fastapi>=0.100", "uvicorn>=0.24", "types-PyYAML>=6.0.12.20260906", "aiortc>=1.14", "a2a-sdk[http-server]>=1.2.3", "PyJWT[crypto]>=2.10.1"]
        args: [--ignore-missing-imports]

  - repo: local
    hooks:
      - id: ngn-rust-format
        name: Rust harness formatting
        entry: bash ngn/scripts/check.sh rust-format
        language: system
        pass_filenames: false
        always_run: true
      - id: ngn-rust-clippy
        name: Rust harness strict clippy
        entry: bash ngn/scripts/check.sh rust-clippy
        language: system
        pass_filenames: false
        always_run: true
      - id: ngn-rust-tests
        name: Rust harness tests
        entry: bash ngn/scripts/check.sh rust-tests
        language: system
        pass_filenames: false
        always_run: true
      - id: ngn-python-lint
        name: Runtime adapter lint
        entry: bash ngn/scripts/check.sh python-lint
        language: system
        pass_filenames: false
        always_run: true
      - id: ngn-python-format
        name: Runtime adapter formatting
        entry: bash ngn/scripts/check.sh python-format
        language: system
        pass_filenames: false
        always_run: true
      - id: ngn-python-types
        name: Runtime adapter strict types
        entry: bash ngn/scripts/check.sh python-types
        language: system
        pass_filenames: false
        always_run: true
      - id: ngn-python-tests
        name: Runtime adapter tests
        entry: bash ngn/scripts/check.sh python-tests
        language: system
        pass_filenames: false
        always_run: true
      - id: ngn-browser-syntax
        name: Rust browser syntax
        entry: bash ngn/scripts/check.sh browser-syntax
        language: system
        pass_filenames: false
        always_run: true
      - id: ngn-browser-tests
        name: Rust browser regressions
        entry: bash ngn/scripts/check.sh browser-tests
        language: system
        pass_filenames: false
        always_run: true
