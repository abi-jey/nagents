[package]
name = "ngn"
description = "A Rust agent harness, terminal client and local web server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64 = "0.22"
clap.workspace = true
crossterm.workspace = true
futures-util.workspace = true
flate2.workspace = true
fs2.workspace = true
ngn-api.workspace = true
ngn-core.workspace = true
ngn-protocol.workspace = true
ratatui.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = "2"
tar.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-util.workspace = true
uuid.workspace = true
pulldown-cmark = { version = "0.13.6", default-features = false }
unicode-segmentation = "1.13"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["fs", "user", "signal", "process", "term", "poll"] }
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
ngn-core = { workspace = true, features = ["test-support"] }
rusqlite.workspace = true
tempfile.workspace = true
tower.workspace = true

[lints]
workspace = true
