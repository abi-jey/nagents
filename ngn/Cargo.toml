[workspace]
members = ["crates/nagents-native", "crates/ngn-api", "crates/ngn"]
resolver = "2"

[workspace.package]
version = "0.100.52"
edition = "2024"
rust-version = "1.93"
license = "MIT"
authors = ["Abbas Jafari"]

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
cap-std = "3"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
flate2 = "1"
fs2 = "0.4"
ignore = "0.4.34"
nagents-native = { path = "crates/nagents-native" }
ngn-api = { path = "crates/ngn-api" }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "unstable-rendered-line-info"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tar = "0.4"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = true
