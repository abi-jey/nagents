[build-system]
requires = ["hatchling>=1.29"]
build-backend = "hatchling.build"

[project]
name = "ngn-nagents"
version = "0.100.47"
description = "Compatibility marker that lets older ngn releases update to engine-based bundles"
requires-python = ">=3.12, <4.0"
license = "MIT"
dependencies = ["nagents>=0.100.47,<0.101"]

[tool.hatch.build.targets.wheel]
packages = ["src/ngn_nagents"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# Keep the existing TypeAlias and TypeVar declarations instead of requiring PEP 695.
ignore = ["E501", "UP040", "UP047"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.mypy]
strict = true
