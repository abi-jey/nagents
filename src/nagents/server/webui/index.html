<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Server</title>
<style>
:root {
  --bg: #0f0f13;
  --surface: #1a1a24;
  --border: #2a2a3a;
  --text: #e0e0e0;
  --muted: #888;
  --accent: #6c5ce7;
  --accent-dim: #4a3db8;
  --success: #00b894;
  --error: #e17055;
  --tool: #0984e3;
  --user-bubble: var(--accent);
  --agent-bubble: var(--surface);
  --radius: 8px;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  overflow: hidden;
}
/* Sidebar */
.sidebar {
  width: 280px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}
.sidebar-header {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  font-weight: 600;
  font-size: 14px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.sidebar-section {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}
.sidebar-section h3 {
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 6px 8px;
  margin-top: 4px;
}
.tool-item, .attachment-item {
  padding: 6px 10px;
  font-size: 12px;
  border-radius: 4px;
  cursor: default;
  color: var(--muted);
  word-break: break-all;
}
.tool-item:hover, .attachment-item:hover { background: var(--border); }
.tool-item .name { color: var(--text); font-weight: 500; }
.attachment-item .name { color: var(--accent); cursor: pointer; }
.attachment-item .meta { font-size: 10px; }
/* Main */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.header {
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 8px;
}
.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--success);
}
.chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.message {
  max-width: 80%;
  padding: 10px 14px;
  border-radius: var(--radius);
  font-size: 13px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
}
.message.user {
  align-self: flex-end;
  background: var(--user-bubble);
}
.message.agent {
  align-self: flex-start;
  background: var(--agent-bubble);
  border: 1px solid var(--border);
}
.message.tool {
  align-self: flex-start;
  background: transparent;
  border: 1px dashed var(--border);
  font-size: 11px;
  color: var(--tool);
  padding: 6px 10px;
}
.message.error {
  align-self: flex-start;
  color: var(--error);
  font-size: 12px;
  padding: 6px 10px;
  background: transparent;
}
.input-area {
  padding: 12px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
}
.input-area input {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 14px;
  color: var(--text);
  font-size: 13px;
  outline: none;
  font-family: var(--font);
}
.input-area input:focus { border-color: var(--accent); }
.input-area button {
  background: var(--accent);
  color: white;
  border: none;
  border-radius: var(--radius);
  padding: 0 20px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: var(--font);
}
.input-area button:hover { background: var(--accent-dim); }
.input-area button:disabled { opacity: 0.4; cursor: default; }
.placeholder {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  font-size: 14px;
}
/* Event log (right sidebar) */
.event-log {
  width: 320px;
  background: var(--surface);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}
.event-log-header {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  font-weight: 600;
  font-size: 14px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.event-log-header button {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 4px;
  padding: 2px 8px;
  font-size: 11px;
  cursor: pointer;
  font-family: var(--font);
}
.event-log-header button:hover { color: var(--text); border-color: var(--accent); }
.event-log-body {
  flex: 1;
  overflow-y: auto;
  padding: 6px;
  font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
  font-size: 11px;
  line-height: 1.4;
}
.event-entry {
  padding: 4px 6px;
  border-radius: 4px;
  margin-bottom: 3px;
  word-break: break-all;
  white-space: pre-wrap;
  color: var(--muted);
  border-left: 2px solid var(--border);
}
.event-entry .ts { color: #555; margin-right: 4px; }
.event-entry .tag {
  font-weight: 600;
  margin-right: 4px;
}
.event-entry.type-text .tag { color: var(--text); }
.event-entry.type-tool_call .tag { color: var(--tool); }
.event-entry.type-tool_result .tag { color: var(--success); }
.event-entry.type-done .tag { color: var(--accent); }
.event-entry.type-error .tag { color: var(--error); }
</style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar">
  <div class="sidebar-header">Agent Server</div>
  <div class="sidebar-section" id="tools-list">
    <h3>Tools</h3>
    <div id="tools-container"></div>
  </div>
  <div class="sidebar-section" id="attachments-list">
    <h3>Attachments</h3>
    <div id="attachments-container"></div>
  </div>
</aside>

<!-- Main Chat -->
<main class="main">
  <header class="header">
    <span class="status-dot" id="status-dot"></span>
    <span id="status-text">connected</span>
  </header>

  <div class="chat" id="chat-container">
    <div class="placeholder">Send a message to start</div>
  </div>

  <form class="input-area" id="chat-form">
    <input type="text" id="chat-input" placeholder="Type a message..." autofocus autocomplete="off">
    <button type="submit" id="send-btn">Send</button>
  </form>
</main>

<!-- Event Log (right sidebar) -->
<aside class="event-log">
  <div class="event-log-header">
    <span>Events</span>
    <button id="clear-events-btn" type="button">clear</button>
  </div>
  <div class="event-log-body" id="event-log-body"></div>
</aside>

<script>
// ── State ──
let sessionId = null;
const $ = (s) => document.querySelector(s);
const chat = $('#chat-container');
const input = $('#chat-input');
const form = $('#chat-form');
const sendBtn = $('#send-btn');
const statusDot = $('#status-dot');
const statusText = $('#status-text');
const eventLog = $('#event-log-body');
let streaming = false;

// ── Helpers ──
function addMessage(type, text) {
  if (chat.querySelector('.placeholder')) chat.innerHTML = '';
  const div = document.createElement('div');
  div.className = `message ${type}`;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

let currentAgentMsg = null;
function appendText(text) {
  if (!currentAgentMsg) {
    currentAgentMsg = addMessage('agent', '');
  }
  currentAgentMsg.textContent += text;
  chat.scrollTop = chat.scrollHeight;
}

// ── SSE Stream ──
async function sendMessage(message) {
  if (streaming) return;
  streaming = true;
  sendBtn.disabled = true;
  input.disabled = true;
  currentAgentMsg = null;

  addMessage('user', message);

  try {
    const res = await fetch('/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message, session_id: sessionId || '', user_id: 'webui' }),
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const evt = JSON.parse(line.slice(6));
          handleEvent(evt);
        } catch(e) {}
      }
    }
  } catch(e) {
    addMessage('error', 'Connection error: ' + e.message);
    setStatus(false);
  }

  streaming = false;
  sendBtn.disabled = false;
  input.disabled = false;
  input.focus();
  refreshSidebar();
}

// ── Event log ──
function logEvent(evt) {
  const ts = new Date().toLocaleTimeString('en-US', { hour12: false }) + '.' + String(Date.now() % 1000).padStart(3, '0');
  const div = document.createElement('div');
  div.className = `event-entry type-${evt.type}`;
  const tag = document.createElement('span');
  tag.className = 'tag';
  tag.textContent = evt.type;
  const time = document.createElement('span');
  time.className = 'ts';
  time.textContent = ts;
  const payload = document.createElement('span');
  const { type, ...rest } = evt;
  payload.textContent = JSON.stringify(rest);
  div.append(time, tag, payload);
  eventLog.appendChild(div);
  eventLog.scrollTop = eventLog.scrollHeight;
}

function handleEvent(evt) {
  logEvent(evt);
  switch (evt.type) {
    case 'text':
      appendText(evt.content);
      break;
    case 'tool_call':
      addMessage('tool', `🔧 ${evt.name}(${JSON.stringify(evt.arguments)})`);
      break;
    case 'tool_result':
      // skip verbose results
      break;
    case 'done':
      sessionId = evt.session_id;
      currentAgentMsg = null;
      if (evt.attachments?.length) {
        addMessage('tool', `📎 ${evt.attachments.length} attachment(s): ${evt.attachments.map(a => a.filename).join(', ')}`);
      }
      break;
    case 'error':
      addMessage('error', `Error: ${evt.message}`);
      break;
  }
}

// ── Sidebar ──
async function refreshSidebar() {
  await loadTools();
  await loadAttachments();
}

async function loadTools() {
  try {
    const res = await fetch('/tools');
    const tools = await res.json();
    const c = $('#tools-container');
    c.innerHTML = tools.map(t => `<div class="tool-item"><span class="name">${esc(t.name)}</span><br>${esc(t.doc)}</div>`).join('');
  } catch(e) {}
}

async function loadAttachments() {
  try {
    const res = await fetch('/attachments');
    const atts = await res.json();
    const c = $('#attachments-container');
    c.innerHTML = atts.map(a => `
      <div class="attachment-item">
        <a class="name" href="/attachments/${a.id}" target="_blank" title="${esc(a.description)}">${esc(a.filename)}</a>
        <div class="meta">${fmtSize(a.size)} · ${a.fetch_count} downloads</div>
      </div>
    `).join('') || '<div class="attachment-item" style="color:var(--muted)">none</div>';
  } catch(e) {}
}

function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtSize(n) {
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n/1024).toFixed(1) + ' KB';
  return (n/1048576).toFixed(1) + ' MB';
}

function setStatus(ok) {
  statusDot.style.background = ok ? 'var(--success)' : 'var(--error)';
  statusText.textContent = ok ? 'connected' : 'error';
}

// ── Init ──
form.addEventListener('submit', (e) => {
  e.preventDefault();
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';
  sendMessage(msg);
});

loadTools();
loadAttachments();
setStatus(true);
$('#clear-events-btn').addEventListener('click', () => { eventLog.innerHTML = ''; });
</script>
</body>
</html>
